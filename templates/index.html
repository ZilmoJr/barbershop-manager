<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Barbershop Manager</title>
    <link rel="stylesheet" href="/static/style.css">
   
</head>

<body>

    <h1>Cadastro Cliente</h1>
    <form id="clienteForm">

    <h2>Clientes</h2>
    <ul id="lista-clientes"></ul>
    <script src="/static/app.js"></script>
    
</body>

</html>
